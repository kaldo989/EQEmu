OP_GroupInvite=0x1d90	#RE SoF x64: send and recv. Receive handler FUN_1402827f0 (dispatched for 0x1d90 and 0x1e7e) reads the inviter name at payload+64 and a u32 at payload+152, prints eqstr 12280 "%1 invites you to join a group.", then sets PlayerClient::InvitedToGroup (+0x13b1) and updates the group window. No size gate.
OP_GroupFollow=0x8de	#RE SoF x64: the group invite accept, sent by FUN_140260420 when the invitee clicks FOLLOW in the group window (also reachable from /follow and the hot button). Payload 156 bytes (two names + 28 byte tail). FUN_140260420 chooses 0x8de when the one shot flag DAT_140eb0b9c is set, and FUN_1402827f0 sets that flag only when the invite arrived on 0x1d90 - an inviter who was not yet in a group, so this is the accept that forms the group.
OP_GroupFollow2=0x70b7	#RE SoF x64: the same send site FUN_140260420, same 156 byte layout, taken when the invite arrived on 0x1e7e - an inviter already in a group. Matches EQEmu's own note for OP_GroupFollow2 ("follow into an already established group"). Decoder forwards to OP_GroupFollow.
OP_GroupAutoFollow=0x4b97	#RE SoF x64: /follow <name>, the auto follow request - single char[64] name, sender FUN_14020ee10, eqstr 13225-13229. This is a different send site from the group window accept, so it is not OP_GroupFollow. Registered to Handle_OP_GroupFollow, which resolves the name and calls GroupFollow().
OP_GroupUpdate=0x57b2	#RE SoF x64: the group roster that populates the group window. Receive handler FUN_1402c2c40 (dispatcher branch 0x1401e5cb6, CMP 0x57b2 at 0x1401e45a8) creates CGroup at pinstLocalPC + 0x2eb8 and runs the variable length deserializer FUN_140637630. No size gate. EQEmu's fixed GroupUpdate_Struct does not match - see ENCODE(OP_GroupUpdate).
OP_GroupUpdateB=0x57b2	#RE SoF x64: same handler and same wire format as OP_GroupUpdate. Client::SendGroupCreatePacket already writes the variable length shape but with 3 role bytes, a u32 timestamp and no unique player id - ENCODE(OP_GroupUpdateB) widens them.
OP_GroupCancelInvite=0x1f25	#RE Laurion x64: BOTH, payload 156. Receive handler FUN_140282be0 (dispatcher call site 0x1401e5b3f) switches on the subcommand byte at payload+152 and prints eqstr 12264 "%1 is currently considering joining another group." (1), 12265 "%1 is already in another group." (2), 12266 "%1 rejects your offer to join the group." (3), 5086 "%1 is considering joining another raid." (4), 5088 "%1 rejects your invite because they are in a raid..." (5), formatting with the name at payload+64; any other value is ignored, no size gate. Send sites: FUN_140257290 (the invitee declines - prints eqstr 12289 "You cancel the invitation to join %1's group.", sends subcommand 3, then clears InvitedToGroup) and FUN_1402827f0 (the invite handler auto-declines with 1 / 4 / 5 when it will not accept). Layout: name1@0 = inviter, name2@64 = invitee (the %1 the receiver prints), u32 subcommand@152, u16 0x100@144, u32 zeroed@128. EQEmu's GroupCancel_Struct is 129 with the toggle at +128, so DECODE/ENCODE(OP_GroupCancelInvite) moves the subcommand between +152 and +128. Supersedes the OP_GroupTargetNames guess in LS/opcodes/batch_15.md.
OP_GroupAcknowledge=0x18a4	#RE Laurion x64: recv-only. Group handler FUN_1402c2930 branch 0x18a4 (dispatcher block 0x1401e5c58) prints eqstr 12004 "You have joined the group." and reads nothing else from the payload. This is Client::SendGroupJoinAcknowledge's packet (zone/client.cpp:6820, 4 byte body) - the joiner's own confirmation, which the roster 0x57b2 does not produce for the joiner. Passthrough encode: the client ignores the body.
OP_GroupDelete=0x0000	# no Laurion equivalent: the client's /disband handler FUN_140217530 routes to FUN_140257290, which sends OP_GroupDisband 0x78ef. Server to client a disband is a clear: 0x7be0 (with message), 0x7262 / 0x27ca / 0x2e2c (silent).
