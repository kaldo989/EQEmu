# 0x609c carries both directions for the item stats popup: CItemDisplayWnd::SendItemLink
# (FUN_14040fbf0) sends the request and FUN_1401fb540 reads the reply on the same opcode.
# EQEmu resolves an incoming opcode through eq_to_emu[], which is filled in emu_oplist.h order, so
# only one name may hold 0x609c. OP_ItemLinkResponse is the one that wins, and OP_ItemLinkClick is
# deliberately left unmapped for 0x609c so that request dispatches to Handle_OP_ItemLinkResponse.
# OP_ItemLinkClick instead carries 0x6159, the AdvLoot inspect request: CAdvancedLootWnd
# alt+right-click on the item-name column -> FUN_1400A6370 -> FUN_1400A6250 ->
# FUN_14046C5C0(DAT_140d83170 /*ItemDisplayWnd*/, record[0] /*item id*/). Fixed 24 byte body, no
# variable part, so it decodes straight into ItemViewRequest_Struct and reuses the existing
# Handle_OP_ItemLinkClick -> SendItemPacket(0, inst, ItemPacketViewLink) path.
OP_ItemLinkResponse=0x609c
OP_ItemLinkClick=0x6159
# 0x0497 is the other AdvLoot inspect request: CAdvancedLootWnd alt+left-click on the item-name column
# (FUN_1400A4020 -> FUN_14040FA60, 80 byte body: item id, flags, 64 byte link string, two dwords).
# Decoded as OP_ItemLinkInspect and dispatched to Handle_OP_ItemLinkResponse, which replies with
# ItemPacketViewLink. 0x0497 was previously unmapped and dropped as OP_Unknown.
OP_ItemLinkInspect=0x0497
# 0x1e67 is the packet the client sends when a saylink is clicked. CChatWindow__WndNotification
# (FUN_1403948d0) handles WndNotify 0x1b - the link-click event, the same notification id the old
# "<a WndNotify=\"27,...\">" task links used - parses the 90 character link data with FUN_1402357e0 into an
# 84 byte record, ORs the keyboard modifier flags from CXWndManager__GetKeyboardFlags into the record's
# +0x20 dword, and sends 86 bytes total. Send only: a whole-program scan for the immediate 0x1e67 finds
# four real send sites (chat window plus FUN_140482580, FUN_14048a080, FUN_1404f3340, all of which call
# the same link parser) and no receive case in ZonePacket__dispatchRecv, so the client expects no reply.
# The record starts with item_id, augments[6] and hash - the first 36 bytes of ItemViewRequest_Struct -
# so laurion.cpp rebuilds that struct and Handle_OP_ItemLinkClick runs, including its SAYLINK_ITEM_ID
# branch that looks the stored phrase up and dispatches it as a # command. This is what makes the #find
# item "X" summon links work: InterpretCmd (0x14026322c) discards any typed line that begins with '#'
# before it can reach a send site, so a link is the only way to get a # command onto the wire.
# 0x1e67 was previously unmapped and dropped as OP_Unknown.
OP_SayLinkClick=0x1e67
