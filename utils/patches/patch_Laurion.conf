OP_GroupFollow2=0x70b7	#RE SoF x64: the group invite accept, sent by FUN_140260420 when the invitee clicks FOLLOW. Payload 156 bytes (two names + 28 byte tail). The second pass after the Advanced Loot warning uses 0x8de with the same layout, which needs its own opcode name.
OP_GroupInvite2=0x1e7e
OP_GroupInvitePrompt=0x7e71	#RE SoF x64: recv-only. Handler 0x1401d7758 -> FUN_1403aa570 reads a u64 hash key at payload+0x18, resolves the inviter via PlayerManagerClient::GetPlayerFromHashKey, shows the fellowship invite prompt. No size gate. Live capture 2026-10-10: payload 32 bytes, +0x18 = 0x110 = inviter entity id, lookup returned the inviter and the prompt string was built. This is the client's Fellowship subsystem, not EQEmu's Group subsystem - accepting the prompt sends 0x2e33 subcommand 4, which EQEmu has no handler for.
OP_GroupDisbandYou=0x7be0	#RE SoF x64: group handler FUN_1402c2930 branch 0x7be0 prints eqstr 12001 "You have been removed from the group." then FUN_1402bff30 clears the group object. Nothing else in the payload is read. EQEmu sends this to the departing member.
OP_GroupDisbandOther=0x14cc	#RE SoF x64: group handler FUN_1402c2930 branch 0x14cc calls FUN_140294e80(group, payload+64), which looks a member up by name and clears its slot through FUN_140637260. This is the only client path that removes a single member - the roster deserializer FUN_140637630 clears all six slots and rebuilds from its entries, so it can only add. EQEmu sends this to the remaining members. Both branches read the payload at +64, which is GroupGeneric_Struct::name2.
OP_GroupDisbandClear=0x7262	#RE SoF x64: recv-only. Dispatcher branch 0x1401e5c82 (CMP 0x7262 at 0x1401e49af) calls FUN_1402bff30(pinstLocalPC) and reads no payload at all. FUN_1402bff30 clears CGroup at pinstLocalPC+0x2eb8, runs FUN_1402ece10, and loops 0xf70..0xf7c clearing the group xtarget slots through pinstSpawnManager vtable slot +0x10. This is the same function the 0x7be0 branch calls, so 0x7262 is the silent variant of the clear - no chat message. OP_GroupDisband itself stays 0x78ef because that is the client's disband REQUEST (4 send sites in FUN_140257290, no dispatcher compare) and Handle_OP_GroupDisband needs it.
OP_GroupLeaderChange=0x4cf7	#RE Laurion x64: recv-only. Group handler FUN_1402c2930 branch 0x4cf7 (dispatcher block 0x1401e5c58) looks a member up by the name at payload+64 (FUN_1402946f0) and calls CGroup vtable +0x28 = FUN_140637320, which sets m_groupLeader (CGroupBase +0x38) and fires event 0 on FUN_140294940 (eqstr 5040/5041 "... is now the group leader"). Matches GroupLeaderChange_Struct::LeaderName at +64, which is the only field Client::SendGroupLeaderChangePacket fills, so it passes through unchanged. The neighbouring branch 0x1422 is NOT this packet: it renames a member slot (lookup by name at +0, new name at +64).
