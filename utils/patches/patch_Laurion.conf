# New Opcodes
OP_SpawnPositionUpdate=0x0000	# Actually OP_MobUpdate ?
# Group / raid mana and endurance bars. ZonePacket__dispatchRecv routes four opcodes each to one handler:
# FUN_1401ee230 (mana) 0x6a45 / 0x3b44 / 0x0606 / 0x246a and FUN_1401edfd0 (endurance) 0x128e / 0x09cf /
# 0x46fb / 0x6dbc. The arms that pass `MOV R8D, 0x64` carry a bare percentage (record 6 bytes:
# uint16 spawn id + uint32 percent); the arms that read `dword [data + 0x6]` carry current + maximum
# (record 10 bytes). The second opcode of each pair only differs in setting param_4, which the handler
# writes to spawn+0x1360. Opcode arms found by walking back from each JZ to its
# `cmp dword [RSP+0x74], imm` - same method as docs/mercenary.md 4.9.1.
OP_MobManaUpdate=0x6a45		#RE Laurion x64: percent arm at 0x1401e4dc1 (JZ 0x1401e48a1, cmp 0x6a45);
	# handler converts to a percentage and sets spawn+0x41c = 100. Record is 6 bytes, not 3 - see
	# Laurion::structs::MobManaUpdate_Struct.
OP_MobEnduranceUpdate=0x128e	#RE Laurion x64: percent arm at 0x1401e4eb9 (JZ 0x1401e3aca, cmp 0x128e).
OP_ManaUpdate=0x0606		#RE Laurion x64: current+maximum arm at 0x1401e4e37 (JZ 0x1401e38c9, cmp 0x606).
	# Because the spawn is pinstLocalPlayer the handler stores param_2 and param_3 raw instead of
	# normalising to a percentage, so this is the one pair where the absolute values matter. Field order
	# is {u16 spawn, u32 cur, u32 max} - Client::BuildManaUpdatePacket picks it per client.
OP_EnduranceUpdate=0x46fb	#RE Laurion x64: current+maximum arm at 0x1401e4f2f (JZ 0x1401e4385, cmp 0x46fb).
# Flagged twins of the eight above, unmapped because EQEmu has no opcode that wants spawn+0x1360 set:
#   mana      0x3b44 (percent, flag)  0x246a (current+max, flag)
#   endurance 0x09cf (percent, flag)  0x6dbc (current+max, flag)

# Mercenary Opcodes
#
# Laurion splits mercenaries across two dispatch paths:
#   * FUN_1402af060 (the CMercenaryClientManager dispatcher) handles everything below except
#     the four alternate-advancement opcodes.
#   * ZonePacket__dispatchRecv arms 0x0516 / 0x3e8c / 0x50e6 / 0x78e8 at 0x1401e37ea,
#     0x1401e41aa, 0x1401e44b7 and 0x1401e4a49, all funnelling into FUN_1401a5fa0.
# Payload shapes below were read out of the dispatcher arms themselves; see docs/mercenary.md 4.

# --- Mercenary alternate advancement (bypasses FUN_1402af060) ---
OP_MercenaryAABuy=0x3861	#RE SoF x64: C->S, 20 byte payload. u32 ability_id | u32 0 | u64 0 | u32 mode. Client: FUN_1401a6db0 sends mode 2 normally, (param_4+9) when a rank is forced. Server answers with OP_MercenaryAAAction (0x50e6).
OP_MercenaryAAAbilities=0x78e8	#RE SoF x64: S->C ability definition list that populates AAW_MercAAList. u32 count, then count x { 10 x u32, u32 array_count, array_count x {u32 lo, u32 hi} }. Client: FUN_1401a5fa0 -> FUN_1401a7090 + FUN_1401a6ea0. It clears the definition container (mgr+0x48) and group index (mgr+0x268) first, so this is a full replacement and is safe to resend on every zone-in.
OP_MercenaryAAAction=0x50e6	#RE SoF x64: S->C, 20 byte payload. u32 arg0 | u32 arg1 | u64 arg2 | u32 action. action 0/1 set the AA point pool, 2 and 7 grant a rank, 3 and 8 clear one, 4 refunds everything. Actions 5 and 6 are not handled by the client and must never be sent.
OP_MercenaryAAGrant=0x0516	#RE SoF x64: S->C, u32 count then count x {u32 aa_id, u32 value}. Client clears its granted-ability container (mgr+0x6d0) and the three CAltAdvManager counters first, so this is authoritative, not incremental. FUN_1401a71f0 drops a grant whose ability definition is not in the 0x78e8 container, so 0x78e8 has to go first.
OP_MercenaryAARanks=0x3e8c	#RE SoF x64: S->C, u32 n, u32 ids[n], u32 m, u32 values[m] (NOT interleaved). Client silently discards the packet unless n == m.

# --- Mercenary lists and shop ---
OP_MercenaryDataUpdateRequest=0x0b22	#RE SoF x64: bidirectional, and the two directions are NOT the same shape. C->S stance change, 8 bytes: i32 stance_group_id | i32 stance_id (FUN_14044f160, from StanceListBox). S->C stance notification, 4 bytes: i32 stance_id; the arm at 0x1402af12c reads the first dword only when a payload is present (0 otherwise) and raises UI event 0x10 through FUN_1402ab7f0. Older clients sent it with no payload, which is why the handler accepts 0 or 8.
OP_MercenaryDataUpdate=0x59b7	#RE SoF x64: S->C owned mercenary list. i32 selected_index | i32 count | count x MercenaryRecord | i32 num_mercenaries | i32 max_mercenaries. Client: FUN_1402ace10; leftover bytes -> "ERROR: Corrupt MSG_MERCENARIES."
OP_MercenaryDataRequest=0x7397	#RE SoF x64: C->S shop request, i32 merchant entity id (FUN_1402b1290 sends mgr+0x26c).
OP_MercenaryDataResponse=0x689c	#RE SoF x64: S->C merchant shop list. i32 type_count | i32 type_dbstr_id[type_count] | i32 merc_count | merc_count x MercenaryRecord. There is NO merchant id on the wire: the client already holds it in mgr+0x26c from the request. Client: FUN_1402acfd0
OP_MercenarySelect=0xb8f3	#RE SoF x64: S->C, i32 index into the owned list. FUN_1402af060 arm at 0x1402afa48 copies list[index] (0xE0 per record) into MercenaryClientData at mgr+0x140 and sets mgr+0x268. Index < 0 or >= count is ignored. Client never sends this opcode.

# --- Hire / dismiss / switch ---
OP_MercenaryHire=0x5193	#RE SoF x64: bidirectional. C->S hire request, i32 merc_id | i32 arg | i32 merchant_id | u8 flag (FUN_1402afb60). S->C result, i32 reason 0..0x15 (FUN_1402ae5f0), which is the client's whole localized hire-error vocabulary.
OP_MercenaryDismiss=0x4ec9	#RE SoF x64: bidirectional, opcode only, no payload. C->S from FUN_1402ab240; S->C arm at 0x1402af7e8 clears hasMercenary, sets state 6, zeroes restorationTime and prints "Your mercenary is being dismissed!"
OP_MercenarySwitch=0x72b6	#RE SoF x64: bidirectional. C->S, i32 owned-list index (FUN_1402b2030, which refuses locally when the index is out of range or already current -> "Already using that mercenary!"). S->C result, i32 unk0 | i32 suspend_remaining_ms | i32 result 0..5 (FUN_1402ae8e0): 0 ok, 1 not in fast regen, 2 cannot unsuspend yet (remaining_ms formats the delay), 3 lost slot access, 4 current merc dead, 5 cannot switch now.
OP_MercenaryTimerRequest=0x7172	#RE SoF x64: C->S, opcode only. Sent from the 0x4c40 arm when the state push contradicts what the client had, i.e. the client is asking the server to re-sync it.

# --- Active mercenary state ---
OP_MercenaryAssign=0x4c40	#RE SoF x64: S->C active mercenary state push, 24 bytes, all aligned: i32 has_mercenary (only the low byte is read) | i32 init_time_ms -> mgr+0x278 | i32 warning_time_ms -> mgr+0x27c | i32 state -> MercenaryClientData+0x04 | i64 restoration_time -> MercenaryClientData+0x08. Disassembly at 0x1402af701..0x1402af740. NOT the same shape as EQEmu's 12 byte MercenaryAssign_Struct.
OP_MercenaryTimer=0x6f85	#RE SoF x64: S->C upkeep tick, i32 time_remaining -> MercenaryInfo+0x24, then mgr+0x280 = GetTickCount() and UI event 0x13. Client never sends it.
OP_MercenaryClearTimers=0x06ed	#RE SoF x64: S->C, opcode only. Sets unsuspendedTime and restorationTime to now and prints "Your mercenary timers have all been cleared".
OP_MercenarySuspendRequest=0x6bc2	#RE SoF x64: C->S, u8 0x30 (FUN_1402afab0). Suspend and unsuspend share this one request; the server toggles.
OP_MercenarySuspendResponse=0x4815	#RE SoF x64: S->C, opcode only. Arm at 0x1402af6d0: unless the state is already 0, 1, 4 or 5 it becomes 2 (suspended), then "Your mercenary has been suspended." and UI event 6.
OP_MercenaryUnsuspend=0x184e	#RE SoF x64: S->C, opcode only. State <- 6, unsuspendedTime <- now, UI event 3.
OP_MercenaryUnsuspendResponse=0x421c	#RE SoF x64: S->C, u8 use_alt_currency. State <- 6, unsuspendedTime <- now, then FUN_1402ac830 prints the upkeep charge line: "You have been charged a mercenary upkeep cost of %d plat, and %d gold ..." or "... %d %s ..." with the alt currency name. Costs are in 1/10 plat units (plat = cost/10, gold = cost%10).
OP_MercenaryStateDead=0x0d70	#RE SoF x64: S->C, opcode only. State <- 4, restorationTime <- 0, UI event 2.
OP_MercenaryStateNone=0x4cff	#RE SoF x64: S->C, i64 restoration_time. State <- 0, UI event 5.
OP_MercenaryStateReady=0x6c4b	#RE SoF x64: S->C, i64 restoration_time. State <- 1, UI event 2.
OP_MercenaryCostUpdate=0x4135	#RE SoF x64: S->C, 4 x i32 in 1/10 plat units: initialCost -> MercenaryInfo+0x0C | altInitialCost -> +0x14 | upkeepCost -> +0x10 | altUpkeepCost -> +0x18. Order confirmed from 0x1402af347..0x1402af34f, which loads payload+4/+8/+0xC into EBX/EDI/ESI. Used when a mercenary's level or AA changes its price.
OP_MercenaryStatsUpdate=0x1f38	#RE SoF x64: S->C Merc tab stat table. i32 pair_count | pair_count x {i32 key, i32 value}. Client: FUN_1402aeb30 lazily allocates the 44 slot int32 array at mgr+0x250, prefills it with -1, and asserts (helper 0x14007dc80) on any key >= 44. The client computes no mercenary stats itself: every number on the Merc tab, and the three AA counters in the AA window, come out of this array. Without this opcode the tab shows the static XML placeholder zeros.
OP_MercenarySpawnId=0x3296	#RE SoF x64: S->C, i32 spawn id -> mgr+0x274 (mercenarySpawnId). An empty payload clears it to 0.
OP_MercenarySpawnLink=0x33e0	#RE SoF x64: S->C, i32 mercenary_spawn_id | i32 owner_spawn_id. The client writes owner id into spawn(merc)+0x134C and merc id into spawn(owner)+0x1348, then calls FUN_1402e2050. Without this the client does not treat the mercenary NPC as yours: no pet bar, no ownership.

# --- Assist ---
OP_MercenaryCallAssist=0x0183	#RE SoF x64: C->S, u8 0x30. FUN_1402a9f20: the CallForAssistButton and "/assistmerc" with no argument.
OP_MercenaryAssistMode=0x2d14	#RE SoF x64: C->S, u8 on/off. FUN_1402b18c0 sets MercenaryInfo.autoAssist (mcd+0x50) locally and forwards it; driven by AssistModeCheckbox (FUN_1404504d0) and "/assistmerc on|off" (FUN_140228c00).
OP_MercenaryAssistModeResult=0x4be9	#RE SoF x64: bidirectional, i32 value (-1 = unset). S->C arm at 0x1402af76c prints string 0x37ad and raises UI event 0x17.

# --- Messages ---
OP_MercenaryCurrencyMessage=0x466d	#RE SoF x64: S->C. u8 use_alt_currency | 3 pad | i32 currency_id | NUL terminated text. Arm at 0x1402af4fa: MOVZX EDX,byte[R15] and MOV R8D,[R8+0x4] feed FUN_1402ab900, which maps the id through FUN_140665fb0(pinstLocalPC+0x2188,..) and reads dbstr category 17 (regular) or 18 (alternate). currency_id 0 falls back to MercenaryInfo.altCurrencyId. The client prints "%s%s." with (server text, currency name), so the server text must not name the currency.
OP_MercenaryLevelUpgrade=0x4a03	#RE SoF x64: S->C, 120 bytes, no size check in the arm at 0x1402af570. FUN_1402aeda0 reads i32 plat_cost (1/10 plat units; printed as cost/10 plat and cost%10 gold), i32 alt_currency_cost (used when MercenaryClientData+0x20 is set), i32 from_level, i32 to_level and a %s name at +0x14, then copies all 120 bytes to mgr+0x2F4..0x36B for the popup, which offers "Upgrade"(0) and "Dismiss"(1) with a 40000 ms timeout.
OP_MercenaryUnknown2=0x0e5c	#RE SoF x64: S->C, opcode only, UI event 7.
OP_MercenaryUnknown3=0x571f	#RE SoF x64: S->C, opcode only. restorationTime <- 0, UI event 8.
OP_MercenaryUnknown4=0x6bdc	#RE SoF x64: S->C, u8 value, UI event 0x19.
OP_MercenaryUnknown1=0x0000	# Laurion has no counterpart for EQEmu's 1 byte OP_MercenaryUnknown1. Client::SendMercenaryUnknownPacket routes to OP_MercenaryUnknown4 (0x6bdc) on Laurion instead of emitting opcode 0.
OP_MercenaryCommand=0x0000	# Laurion has no OP_MercenaryCommand. Stance changes arrive on OP_MercenaryDataUpdateRequest (0x0b22) and assist on OP_MercenaryAssistMode (0x2d14).
OP_MercenaryUpkeepCharged=0x0000	# Laurion has no dedicated upkeep-charged opcode. The charge line is printed either from OP_MercenaryHire (0x5193) reason 11 (plat/gold) or 12 (alt currency), both of which reach FUN_1402ac7e0 -> FUN_1402ac830, or from OP_MercenaryUnsuspendResponse (0x421c). EQEmu's UpdateMercTimer uses reason 11 and must not also send 0x421c, or the player reads the identical sentence twice.

# --- Mercenary record save/load, logfile, and transfer ---
OP_MercenaryRecordDump=0x2d48	#RE SoF x64: S->C. u64 echo | u32 count | count x {u32 length, bytes}. FUN_1405646e0 reads each entry as a u32 length then that many bytes. FUN_1402ad900 searches each string for "RecordId=" then the next "!", atoi()s between them, resolves the index through FUN_1402abee0 (category 23 description plus "Race: "/"<br>Type: ") and logs "\nIndex: %d - Record Id: %d - List Name: %s\n - Save String: %s\n".
OP_MercenaryRecordDumpReply=0x5783	#RE SoF x64: C->S. The 8 echo bytes from 0x2d48 followed by the accumulated text. Handled by Client::Handle_OP_MercenaryRecordDumpReply.
OP_MercenaryLogfileRequest=0x5baa	#RE SoF x64: C->S, opcode only. FUN_140166c40 prints "Generating mercenary logfile on the server." locally and sends the bare opcode; it is not part of FUN_1402af060.
OP_MercenaryTransferOffer=0xd966	#RE SoF x64: S->C, 28 bytes (MercenaryTransfer_Struct). FUN_1402ad4e0 stores i32 source_spawn_id | i32 target_spawn_id | i32 gold_cost | i32 alt_cost | i32 alt_currency_id (-1 = none) | i32 alt_currency_only (read as a byte) | i32 result at mgr+0x2D8..0x2F0 and shows a 10000 ms confirmation popup. If an offer is already pending it is not replaced: the client echoes the buffer back on 0x452c with result forced to 4.
OP_MercenaryTransferResult=0x452c	#RE SoF x64: bidirectional, 28 bytes. S->C result at +0x18 (0 accepted, 1 denied, 2 not in group, 3 target at max, 4 already pending, 5 target does not meet requirements, 6 target lacks membership, 7 not in fast regeneration mode, 8 cannot transfer to that player) with the target spawn id at +0x04 (FUN_1402ad730). C->S decline, same layout with result 4.


# Looting
OP_LootRequest=0x60e5
OP_EndLootRequest=0x35f6
OP_LootItem=0x0856
OP_LootComplete=0x1f5e
# RE SoF x64: Advanced Loot - variable length, uint16 sub-command at payload offset 0.
# Client dispatcher: FUN_140151c60. Send sites: FUN_14014fca0, FUN_140150240, FUN_140151400,
# FUN_1401522b0, FUN_140153570, FUN_140154570, FUN_140154830, FUN_140154cd0.
OP_AdvLoot=0x3175
# RE SoF x64: Advanced Loot request channel - a second AdvLoot-family opcode, client->server only.
# The client has three send sites and NO receive case anywhere in eqgame.exe (advloot.md S10.7), so this
# opcode is never encoded on the way out. It reuses the 0x3175 sub-command numbering:
#   0x0D {u32 ask_key}                        FUN_140150f00 - Manage Loot window asks for the looter
#                                             response list; answer on OP_AdvLoot subcmd 0x0D
#   0x0F {u32 item_id, u32, string name}      FUN_140150c00 - Free Grab request
#   0x14 {u32 key, u8 flag, u32 n, n x item}  FUN_1401528d0 - corpse item list to chat; relay verbatim
#                                             back on OP_AdvLoot subcmd 0x14
# Variable length with a uint16 sub-command at payload offset 0, so no decoder: PassDecoder leaves it raw
# and Client::Handle_OP_AdvLootManage walks it.
OP_AdvLootManage=0x360e

# RE SoF x64: the group/raid master-looter announcement. ZonePacket__dispatchRecv case 0x3a60 ->
# FUN_140151bf0, which does exactly three things:
#   FUN_140087430(manager + 0x1f0, packet)   u32 -> manager+0x1f0, 64-byte name -> manager+0x1f4
#   FUN_1401550d0(manager, name, 0)          strncmp(name, local player name, 64)
#                                            match -> manager+0x241 = 1, otherwise 0
#   CAdvancedLootWnd::UpdateMasterLooter(name, is_me)   the ADLW_CalculatedMasterLooter label
# manager+0x241 is the Advanced Loot manager's "I am the master looter" flag, and it gates the countdown bar
# (0x140151d52), FUN_14014fca0 (the 0x11 sender), FUN_140150240 (the 0x12 Roll button),
# CAdvancedLootWnd__DoSharedAdvLootAction, FUN_1400a4b50, FUN_1400a5330, FUN_1400aaf80 and the 0x360e subcmd
# 13 path. With nothing on the wire the client falls back to FUN_1401500a0, which copies the LOCAL player's own
# name into manager+0x1f4 and compares it with itself - so every member of a group is their own master looter.
# Variable length (the name is NUL terminated), so no decoder: OUTr only.
OP_MasterLooter=0x3a60

