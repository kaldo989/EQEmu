OP_0x0ede=0x0ede				#RE SoF x64: send site FUN_140229f50 (/xtarget set <slot> <name>) and receive
	# branch 0x1401e02cb share this opcode and layout: u32 spawn_id, u32 slot. The receive handler
	# derives the type from the spawn (2 = PC, 3 = NPC) and calls FUN_14028fb90(), the same slot setter
	# that drives 0x5c3e. It is the peer/single slot form, not the type-carrying form.
	# Handle_OP_0x0ede applies the slot and answers on OP_XTargetResponse (0x123c).
OP_0x06e0=0x06e0				#RE SoF x64: no opcode immediate anywhere in eqgame.exe, so the send site loads
	# it from a table. Payload 20: sixteen bytes that are only ever 0 or 1 plus a trailing uint32.
	# Looks like a settings/feature flag vector. Handle_0x06e0 dumps it.
OP_0x1bdd=0x1bdd				#RE SoF x64: FUN_140163210 and CDisplay__RealRender_World, gated on (arg & 5).
	# Payload 8 = one uint64 copied from *param_4, left as staging buffer garbage when param_4 is null.
	# Observed as the same uint32 twice. Handle_0x1bdd dumps it.
