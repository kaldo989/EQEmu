	# Server->client only: the client has no send site for 0x5765 anywhere in eqgame.exe.
	# Layout is identical to OP_BuffCreate (0x27a1): see docs/targetwnd.md section 4.
OP_XTargetResponse=0x123c	#RE SoF x64: handler FUN_14028ff00. u32 max_slots, u32 count,
	# count x (u32 slot, u8 status, u32 spawn_id, null terminated name). Client slot record is 0x4C bytes.
	# Matches Client::SendXTargetPacket() / SendXTargetUpdates() field order.
OP_XTargetRequest=0x5c3e	#RE SoF x64: send site FUN_14028fb90 (the xtarget slot setter, reached from
	# __ExecuteCmd and from the 0x0ede receive branch). Variable length:
	#   u32 flag (constant 1), u32 slot, u32 type, null terminated name
	# The record list is pinstLocalPC + 0x2EA0 = pExtendedTargetList and the record is 0x4C bytes
	# (u32 xTargetType, u32 status, u32 spawn_id, char name[64]) - so `type` here is the XTargetType
	# enum (MQ XTargetTypes 0..26, MyPetTarget = 24). This is byte-for-byte EQEmu's classic
	# Handle_OP_XTargetRequest layout and it is the ONLY packet that tells the server a slot's TYPE.
	# With 0x0ede (which carries no type) mapped here, no slot could ever be typed MyPetTarget, so
	# UpdateXTargetType(MyPetTarget, ...) never fired and the Pet window target display stayed empty.
