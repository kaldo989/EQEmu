# 0x609c carries both directions for the item stats popup: CItemDisplayWnd::SendItemLink
# (FUN_14040fbf0) sends the request and FUN_1401fb540 reads the reply on the same opcode.
# EQEmu resolves an incoming opcode through eq_to_emu[], which is filled in emu_oplist.h order, so
# only one name may hold 0x609c. OP_ItemLinkResponse is the one that wins, and OP_ItemLinkClick is
# deliberately left unmapped so the incoming request dispatches to Handle_OP_ItemLinkResponse.
OP_ItemLinkResponse=0x609c
OP_ItemLinkClick=0x0000
# 0x1d00 is server to client only: FUN_1401fb190 reads a null terminated item GUID, resolves it through
